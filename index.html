<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: sticky green bar on top, article card + recent-changes rail (stacks under 1000px), namuwiki-style article chrome */
:root{
  --bg:#ececec; --surface:#ffffff; --raised:#f5f5f5; --fg:#141414; --muted:#666666; --line:#d4d4d4; --line2:#e6e6e6;
  --head:#111111; --head2:#000000; --head-ink:#ffffff; --accent:#141414; --accent-ink:#ffffff; --accent-soft:#e3e3e3;
  --link:#0a64a6; --red:#8c8c8c; --code:#efefef; --warn:#f1f1f1; --warn-ink:#222222; --ok:#141414; --bad:#7a7a7a;
  --ink-dark:#141414; --ink-light:#f7f7f7;
  --f-display:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0b; --surface:#151515; --raised:#1d1d1d; --fg:#ebebeb; --muted:#9b9b9b; --line:#2e2e2e; --line2:#232323;
  --head:#000000; --head2:#1c1c1c; --head-ink:#ffffff; --accent:#f0f0f0; --accent-ink:#111111; --accent-soft:#2b2b2b;
  --link:#7ab9eb; --red:#7d7d7d; --code:#222222; --warn:#232323; --warn-ink:#e8e8e8; --ok:#f0f0f0; --bad:#8f8f8f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --surface:#151515; --raised:#1d1d1d; --fg:#ebebeb; --muted:#9b9b9b; --line:#2e2e2e; --line2:#232323;
  --head:#000000; --head2:#1c1c1c; --head-ink:#ffffff; --accent:#f0f0f0; --accent-ink:#111111; --accent-soft:#2b2b2b;
  --link:#7ab9eb; --red:#7d7d7d; --code:#222222; --warn:#232323; --warn-ink:#e8e8e8; --ok:#f0f0f0; --bad:#8f8f8f;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);color:var(--head-ink);box-shadow:0 1px 0 var(--head2)}
.top-in{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:21px;color:var(--head-ink);letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo:hover{text-decoration:none}
.logo img{height:30px;width:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav{display:flex;gap:2px;align-items:center}
.nb{background:transparent;border:0;color:var(--head-ink);padding:6px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.nb:hover{background:rgba(255,255,255,.12)}
.nb svg{opacity:.9}
.menu{position:relative}
.menu-pop{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:190px;padding:6px;z-index:20}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:4px;cursor:pointer;font-size:14px}
.menu-pop button:hover{background:var(--raised)}
.search{margin-left:auto;position:relative;display:flex;flex:1 1 260px;max-width:380px}
.search input{flex:1;min-width:0;border:0;border-radius:4px 0 0 4px;padding:7px 10px;background:var(--surface);color:var(--fg)}
.search button{border:0;background:var(--head2);color:var(--head-ink);padding:0 12px;border-radius:0 4px 4px 0;cursor:pointer}
.sugg{position:absolute;top:100%;left:0;right:0;margin-top:2px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,.15);z-index:20;overflow:hidden}
.sugg div{padding:7px 10px;cursor:pointer;font-size:14px}
.sugg div.on,.sugg div:hover{background:var(--accent-soft)}
@media (max-width:640px){
  .search{flex-basis:100%;max-width:none;margin-left:0;order:3}
  .nav{margin-left:auto}
  .nb .lbl{display:none}
  .nb{padding:7px 9px}
}

/* frame */
.wrap{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
@media (max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.article{padding:22px 26px 30px}
@media (max-width:640px){.article{padding:16px 14px 24px}.wrap{padding-block:10px 20px}}
.side{padding:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px)}
@media (max-width:1000px){.side{position:static}}
.side-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.side-h button{background:none;border:0;color:var(--link);cursor:pointer;font-size:13px}
.rc{list-style:none;margin:0;padding:4px 0}
.rc li{display:flex;gap:8px;justify-content:space-between;padding:5px 14px;font-size:13.5px}
.rc li a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc time{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rc .empty{color:var(--muted);display:block;padding:10px 14px}
.side-note{padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* article head */
.ah{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ah-top{display:flex;gap:10px 16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.atitle{font-family:var(--f-display);font-size:30px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance;min-width:0}
.atitle .ns{color:var(--muted)}
.atitle small{font-family:var(--f-body);font-size:16px;font-weight:400;color:var(--muted)}
@media (max-width:640px){.atitle{font-size:25px}}
.acts{display:flex;border:1px solid var(--line);border-radius:5px;overflow:visible;flex-wrap:wrap;position:relative}
.acts>button,.acts>.menu>button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:5px 12px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:5px;height:100%}
.acts>:last-child,.acts>.menu:last-child>button{border-right:0}
.acts>button:first-child{border-radius:5px 0 0 5px}
.acts>button:hover,.acts>.menu>button:hover{background:var(--raised)}
.acts .menu-pop{left:auto;right:0}
.ameta{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.notice{background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--fg);padding:9px 12px;border-radius:4px;margin-bottom:14px;font-size:14px}
.notice.warn{background:var(--warn);color:var(--warn-ink);border-left-color:var(--warn-ink)}
.catbox{border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13.5px;margin-bottom:16px;background:var(--raised)}
.catbox b{margin-right:6px}
.catbox a+a::before{content:" | ";color:var(--muted)}

/* wiki content */
.wiki{font-size:15.5px}
.wiki .wp{margin:0 0 .55em}
.wiki hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.wiki .wl.red,.red-l{color:var(--link)}
.wiki .wl.red{text-decoration:underline dashed;text-decoration-thickness:1px;text-underline-offset:3px}
.wiki .wext::after{content:"↗";font-size:.75em;margin-left:1px}
.wiki code.wc{font-family:var(--f-mono);font-size:.9em;background:var(--code);padding:1px 5px;border-radius:3px}
.wiki pre.wcode{font-family:var(--f-mono);font-size:13.5px;background:var(--code);border:1px solid var(--line);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:pre;line-height:1.5}
.wiki blockquote.wq{margin:8px 0 12px;padding:8px 14px;border:1px dashed var(--line);border-left:5px solid var(--accent);background:var(--raised);border-radius:3px}
.wiki ul,.wiki ol{margin:2px 0 .6em;padding-left:1.7em}
.wiki li{margin:1px 0}
.wiki .wi{padding-left:1.4em;margin:0 0 .4em}
.wiki img.wimg{max-width:100%;height:auto;vertical-align:middle;border-radius:2px}
.wiki .wimg-c{display:block;margin:0 auto}
.wiki details.wfold{margin:6px 0 10px;border:1px solid var(--line);border-radius:4px}
.wiki details.wfold>summary{cursor:pointer;padding:6px 10px;font-weight:700;background:var(--raised);border-radius:4px;list-style:none}
.wiki details.wfold>summary::-webkit-details-marker{display:none}
.wiki details.wfold>summary::before{content:"▸ ";color:var(--muted)}
.wiki details.wfold[open]>summary::before{content:"▾ "}
.wiki details.wfold[open]>summary{border-radius:4px 4px 0 0;border-bottom:1px solid var(--line)}
.wiki .wfold-b{padding:8px 12px}
.wiki .wbox{margin:4px 0 12px;min-width:0}
.wiki .wbox>:last-child{margin-bottom:0}
.dbg{background-color:var(--wbg)}
.dfg{color:var(--wfg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dbg{background-color:var(--wbgd)} :root:not([data-theme="light"]) .dfg{color:var(--wfgd)}}
:root[data-theme="dark"] .dbg{background-color:var(--wbgd)}
:root[data-theme="dark"] .dfg{color:var(--wfgd)}
.wiki sup.fnref a{font-size:.8em;cursor:pointer}

/* headings */
.wiki .sec{margin-top:4px}
.wiki>.sec{clear:both}
.wiki .wh{display:flex;align-items:baseline;gap:6px;margin:22px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line);font-weight:700;line-height:1.35;cursor:pointer;text-wrap:balance}
.wiki h2.wh{font-size:26px}
.wiki h3.wh{font-size:22px}
.wiki h4.wh{font-size:19px}
.wiki h5.wh,.wiki h6.wh{font-size:17px}
@media (max-width:640px){.wiki h2.wh{font-size:22px}.wiki h3.wh{font-size:19.5px}.wiki h4.wh{font-size:17.5px}}
.wiki .wh .tg{font-size:.55em;color:var(--muted);width:1em;flex:none;transition:transform .15s}
.wiki .sec.folded>.wh .tg{transform:rotate(-90deg)}
.wiki .wh .num{color:var(--muted);font-variant-numeric:tabular-nums}
.wiki .wh .ht{min-width:0;flex:1}
.wiki .wh .ed{font-size:12.5px;font-weight:400;margin-left:auto;white-space:nowrap}
.wiki .sec.folded>.sec-body{display:none}
.wiki .sec:first-of-type>.wh{margin-top:14px}
@media (prefers-reduced-motion:reduce){.wiki .wh .tg{transition:none}}

/* toc */
.toc{display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:4px;padding:10px 18px 12px 14px;margin:6px 0 14px;background:var(--raised)}
.toc-h{font-weight:700;font-size:16px;margin-bottom:4px}
.toc-i{font-size:14.5px;line-height:1.75}
.toc-i a{font-variant-numeric:tabular-nums}

/* tables */
.wt-wrap{overflow-x:auto;margin:6px 0 12px;max-width:100%}
.wt-wrap.al-c{display:flex;justify-content:center}
.wt-wrap.al-r{float:right;clear:right;margin:0 0 12px 18px}
.wt-wrap.al-r>table{margin-left:auto}
@media (max-width:700px){.wt-wrap.al-r{float:none;margin:6px 0 12px}.wt-wrap.al-r>table{margin:0 auto;width:100%!important;max-width:100%}}
table.wt{border-collapse:collapse;border:1px solid var(--line);background:var(--surface)}
table.wt td{border:1px solid var(--line);padding:5px 10px;vertical-align:middle;min-width:2em}
table.wt.bc td{border-color:var(--wtb)}
table.wt.bc{border:2px solid var(--wtb)}
table.wt td>.wp:last-child,table.wt td>:last-child{margin-bottom:0}
.wiki .clr{clear:both}

/* footnotes */
.fns{margin-top:26px;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px;color:var(--fg)}
.fns .fn{margin:3px 0;scroll-margin-top:80px}
.fnpop{position:fixed;z-index:30;max-width:min(360px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:10px 12px;font-size:14px}
.fnpop .go{display:block;margin-top:6px;font-size:12.5px}
.wiki [id]{scroll-margin-top:80px}

/* generic ui */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:5px;cursor:pointer;font-size:14px;color:var(--fg)}
.btn:hover{background:var(--raised);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06);background:var(--accent)}
.btn.dan{color:var(--bad);border-color:currentColor}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-weight:500;font-size:14px}
.field small{color:var(--muted)}
.in{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
.muted{color:var(--muted)}
.empty-state{padding:26px 6px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty-state h2{margin:0;font-size:19px}
.empty-state p{margin:0;color:var(--muted);max-width:60ch}

/* editor */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:0}
.tabs button{background:none;border:1px solid transparent;border-bottom:0;padding:7px 16px;cursor:pointer;border-radius:5px 5px 0 0;margin-bottom:-1px;font-size:14px}
.tabs button.on{background:var(--surface);border-color:var(--line);font-weight:700}
.edbox{position:relative;border:1px solid var(--line);border-top:0;border-radius:0 0 5px 5px;background:var(--surface)}
.slash{position:absolute;z-index:25;width:min(340px,calc(100% - 16px));max-height:280px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.22);padding:4px;font-size:14px}
.slash-h{padding:5px 9px 4px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.slash-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:6px 9px;border-radius:4px;cursor:pointer}
.slash-i.on{background:var(--accent-soft)}
.slash-i b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slash-i code{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.slash-i small{grid-column:1/-1;color:var(--muted);font-size:12.5px;line-height:1.35}
.slash-none{padding:8px 9px;color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:2px;padding:5px;border-bottom:1px solid var(--line);background:var(--raised);position:relative}
.tools button{background:none;border:1px solid transparent;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:13.5px;min-width:30px}
.tools button:hover{background:var(--surface);border-color:var(--line)}
.tools .menu-pop{max-height:260px;overflow:auto}
textarea.ed{display:block;width:100%;min-height:58vh;border:0;padding:12px;font-family:var(--f-mono);font-size:14px;line-height:1.6;resize:vertical;background:var(--surface);color:var(--fg);tab-size:4}
textarea.ed:focus{outline:none}
.preview{padding:14px 16px;min-height:300px}
.help{margin-top:16px;border:1px solid var(--line);border-radius:5px}
.help summary{padding:8px 12px;cursor:pointer;font-weight:500}
.help-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 18px;padding:4px 12px 12px;font-size:13.5px}
.help-g div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line2);padding:3px 0}
.help-g code{font-family:var(--f-mono);font-size:12.5px;background:var(--code);padding:0 4px;border-radius:3px;white-space:pre}

/* lists & tables of ui */
.lst{list-style:none;padding:0;margin:0}
.lst li{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline;padding:8px 2px;border-bottom:1px solid var(--line2)}
.lst li:last-child{border-bottom:0}
.lst .t{font-weight:500}
.lst .m{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.delta{font-size:12.5px;font-variant-numeric:tabular-nums}
.delta.p{color:var(--ok);font-weight:700}.delta.n{color:var(--bad)}.delta.z{color:var(--muted)}
.tag{font-size:11.5px;letter-spacing:.03em;padding:1px 7px;border-radius:10px;background:var(--accent-soft);color:var(--fg)}
.grp-h{font-weight:700;font-size:17px;margin:18px 0 4px;color:var(--fg);font-family:var(--f-display)}
.cols{columns:3 200px;column-gap:24px}
.cols div{break-inside:avoid;padding:2px 0}
.ns-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ns-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:3px 12px;cursor:pointer;font-size:13.5px}
.ns-tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hl{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px}
.snip{color:var(--muted);font-size:13.5px;flex-basis:100%}

/* diff */
.diff{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:4px;overflow-x:auto}
.diff div{white-space:pre-wrap;padding:1px 10px;min-height:1.4em}
.diff .a{background:var(--accent-soft);font-weight:700}
.diff .d{color:var(--muted);text-decoration:line-through}
.diff .s{color:var(--muted);text-align:center;background:var(--raised)}

/* files */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.fcard{border:1px solid var(--line);border-radius:5px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.fcard .th{aspect-ratio:1/1;max-width:100%;background:var(--raised);display:flex;align-items:center;justify-content:center;overflow:hidden}
.fcard .th img{width:100%;height:100%;object-fit:cover}
.fcard .fi{padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fcard .fi a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
(function(){
"use strict";
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const escT=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid=()=>{try{return crypto.randomUUID().replace(/-/g,'').slice(0,20)}catch(e){return (Date.now().toString(36)+Math.random().toString(36).slice(2,12))}};
const pad=n=>String(n).padStart(2,'0');
const fmt=t=>{if(!t)return '-';const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
const rel=t=>{const s=(Date.now()-t)/1000;if(s<60)return '방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';if(s<86400*7)return Math.floor(s/86400)+'일 전';const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()}`};
const normTitle=t=>String(t||'').replace(/[\[\]|#\n\r\t]/g,' ').replace(/\s+/g,' ').trim();
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,3200)}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};

/* ---------- state ---------- */
const S={pages:new Map(),byTitle:new Map(),files:new Map(),recent:[],meta:{},ready:false,mode:'local',canWrite:true,route:null,metaReady:false};
const SITE=()=>S.meta.name||'MPwiki';
const FRONT=()=>S.meta.front||'대문';
function rebuild(){S.byTitle=new Map();for(const p of S.pages.values())S.byTitle.set(p.title,p);S.catIdx=null}
function catMembers(cat){
  if(!S.catIdx){S.catIdx=new Map();for(const p of S.pages.values())for(const c of (p.cats||[])){if(!S.catIdx.has(c))S.catIdx.set(c,[]);S.catIdx.get(c).push(p)}}
  return S.catIdx.get(cat)||[];
}
function exists(t){if(S.byTitle.has(t))return true;if(t.startsWith('분류:'))return catMembers(t.slice(3)).length>0;return false}

/* ---------- storage ---------- */
let db=null,assets=null,downloads=null;
const LS='seoljip-wiki-v1';
let local={pages:{},revisions:[],files:{},meta:{}};
function loadLocal(){const t=lsGet(LS);if(t){try{local=Object.assign(local,JSON.parse(t))}catch(e){}}}
function saveLocal(){lsSet(LS,JSON.stringify(local))}
function applyLocal(){
  S.pages=new Map(Object.entries(local.pages).map(([id,p])=>[id,Object.assign({id},p)]));rebuild();
  S.files=new Map(Object.entries(local.files).map(([id,f])=>[f.name,Object.assign({id},f)]));
  S.recent=local.revisions.slice().sort((a,b)=>b.at-a.at).slice(0,40);
  S.meta=local.meta||{};
}
const store={
  async putPage(id,data){if(db)return db.collection('pages').doc(id).set(data);local.pages[id]=data;saveLocal();applyLocal();dataChanged()},
  async delPage(id){if(db)return db.collection('pages').doc(id).delete();delete local.pages[id];saveLocal();applyLocal();dataChanged()},
  async putRev(id,rev){if(db)return db.collection('revisions').doc(id).set(rev);local.revisions=local.revisions.filter(r=>r.id!==id);local.revisions.push(Object.assign({id},rev));saveLocal();applyLocal();dataChanged()},
  async addRev(rev){if(db)return db.collection('revisions').doc(uid()).set(rev);local.revisions.push(Object.assign({id:uid()},rev));saveLocal();applyLocal();dataChanged()},
  async revsOf(pageId){
    if(db){const s=await db.collection('revisions').where('pageId','==',pageId).get();return s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.rev-a.rev||b.at-a.at)}
    return local.revisions.filter(r=>r.pageId===pageId).sort((a,b)=>b.rev-a.rev||b.at-a.at);
  },
  async putFile(id,data){if(db)return db.collection('files').doc(id).set(data);local.files[id]=data;saveLocal();applyLocal();dataChanged()},
  async delFile(id){if(db)return db.collection('files').doc(id).delete();delete local.files[id];saveLocal();applyLocal();dataChanged()},

function errMsg(e){const c=e&&e.code;if(c==='permission-denied')return '권한이 없습니다. 위키 주인 계정으로 로그인했는지 확인하세요.';if(c==='resource-exhausted')return '오늘 쓸 수 있는 저장량을 다 썼습니다. 내일 다시 시도하세요.';if(c==='quota_exceeded')return '저장 공간이 가득 찼습니다. 오래된 문서나 파일을 지운 뒤 다시 시도하세요.';if(c==='invalid_argument')return '저장 권한이 없거나 문서가 너무 큽니다.';if(c==='resource_exhausted')return '요청이 너무 잦습니다. 잠시 후 다시 시도하세요.';return '저장하지 못했습니다. 연결을 확인하고 다시 시도하세요.'}

const PS='\uE000',PE='\uE001';
function mkCtx(title){return {title,store:[],fn:[],fnNamed:{},cats:[],links:new Set(),incs:new Set(),heads:[],tocPlaced:false,fnPlaced:false}}
function ph(ctx,html,block){ctx.store.push({html,block:!!block});return PS+(ctx.store.length-1)+PE}
function unph(ctx,s){let guard=0;while(s.indexOf(PS)>=0&&guard++<20){s=s.replace(/\uE000(\d+)\uE001/g,(m,i)=>ctx.store[+i]?ctx.store[+i].html:'')}return s}
function stripComments(s){return s.split('\n').filter(l=>!/^##/.test(l)).join('\n')}

function splitArgs(s){const out=[];let d=0,cur='';for(const ch of s){if(ch==='['||ch==='{'||ch==='(')d++;else if(ch===']'||ch==='}'||ch===')')d--;if(ch===','&&d<=0){out.push(cur);cur='';continue}cur+=ch}out.push(cur);return out}
function expandIncludes(src,depth,ctx){
  let out='',i=0;
  while(true){
    const s=src.toLowerCase().indexOf('[include(',i);
    if(s<0){out+=src.slice(i);break}
    const e=src.indexOf(')]',s);
    if(e<0){out+=src.slice(i);break}
    out+=src.slice(i,s);
    const args=splitArgs(src.slice(s+9,e));
    const name=normTitle(args.shift());
    ctx.incs.add(name);
    const p=S.byTitle.get(name);
    if(!p||depth>4){out+=`[[${name}]]`}
    else{
      const params={};
      for(const a of args){const k=a.indexOf('=');if(k>0)params[a.slice(0,k).trim()]=a.slice(k+1).trim()}
      let t=stripComments(p.content);

}

function colorVal(v){
  if(!v)return null;const parts=String(v).split(',').map(x=>x.trim());

const NAMED_LUM={white:1,black:0,red:.3,blue:.11,green:.3,yellow:.89,orange:.6,purple:.25,gray:.5,grey:.5,silver:.75,navy:.05,pink:.85,skyblue:.75,lightgray:.83,gold:.7,brown:.3,crimson:.3,violet:.6,indigo:.15,teal:.35,maroon:.15,olive:.4,lime:.7,aqua:.7,cyan:.7,beige:.95,ivory:.98,lavender:.92};
function colorLum(c){if(!c)return null;if(c[0]==='#')return lum(c);return NAMED_LUM[c]!==undefined?NAMED_LUM[c]:null}
function bgStyle(c,cls){ // returns [style, classes]

  return [`background-color:${c.l};`,''];
}
function fgStyle(c){if(!c)return ['',''];if(c.d)return [`--wfg:${c.l};--wfgd:${c.d};`,'dfg'];return [`color:${c.l};`,'']}
function autoInk(bg,hasColor){ // readable text when only bg is given

function sizeVal(v){v=String(v||'').trim();if(/^\d+(\.\d+)?$/.test(v))return v+'px';if(/^\d+(\.\d+)?(px|%|em|rem)$/.test(v))return v;return null}
function safeStyle(s){s=String(s||'');if(/url\s*\(|expression|javascript:|@import|position\s*:\s*fixed/i.test(s))return '';return s.replace(/[<>"\\]/g,'')}

function extractBraces(src,ctx){
  let out='',i=0;
  while(true){
    const s=src.indexOf('{{{',i);
    if(s<0){out+=src.slice(i);break}
    let d=0,j=s,end=-1;
    while(j<src.length){
      if(src.startsWith('{{{',j)){d++;j+=3;continue}
      if(src.startsWith('}}}',j)){d--;if(d===0){end=j;break}j+=3;continue}
      j++;
    }
    if(end<0){out+=src.slice(i);break}
    out+=src.slice(i,s)+braceBlock(src.slice(s+3,end),ctx);
    i=end+3;

}
function inlineFull(s,ctx){return inline(extractBraces(s,ctx),ctx)}
function braceBlock(inner,ctx){
  let m;

    return ph(ctx,`<div class="wbox" style="${escA(safeStyle(m[1]))}">${renderBlocks(m[2],ctx,false)}</div>`,true);
  }
  if((m=inner.match(/^#!folding[ \t]*([^\n]*)\n?([\s\S]*)$/))){

    return ph(ctx,`<details class="wfold"><summary>${sum}</summary><div class="wfold-b">${renderBlocks(m[2],ctx,false)}</div></details>`,true);
  }
  if((m=inner.match(/^#!(syntax|html|pre)[ \t]*([^\n]*)\n?([\s\S]*)$/))){
    return ph(ctx,`<pre class="wcode"><code>${escT(m[3])}</code></pre>`,true);
  }
  if((m=inner.match(/^#([0-9a-zA-Z]{3,24}(?:,#?[0-9a-zA-Z]{3,24})?)[ \t]([\s\S]*)$/))){
    const cc=colorVal(m[1]);

function scanFootnotes(s,ctx){
  let out='',i=0;
  while(true){
    const st=s.indexOf('[*',i);

    let d=1,j=st+2;

    if(d!==0){out+=s.slice(i);break}
    out+=s.slice(i,st);
    const body=s.slice(st+2,j);
    const m=body.match(/^([^\s\]]*)\s?([\s\S]*)$/);
    const name=m[1],text=m[2];
    let fn;
    if(name&&!text.trim()&&ctx.fnNamed[name]){fn=ctx.fnNamed[name]}

}

function renderImage(name,opts,ctx){

function renderLink(inner,ctx){

function macro(name,arg,ctx){
  const n=name.toLowerCase();
  if(n==='br'||n==='clearfix')return n==='br'?'<br>':'<div class="clr"></div>';
  if(n==='목차'||n==='tableofcontents'){ctx.tocPlaced=true;return '\uE002TOC\uE003'}
  if(n==='각주'||n==='footnote'){ctx.fnPlaced=true;return '\uE002FN\uE003'}
  if(n==='age'&&arg){const d=new Date(arg.trim());if(isNaN(d))return null;const t=new Date();let a=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--;return String(a)}
  if(n==='dday'&&arg){const d=new Date(arg.trim()+'T00:00:00');if(isNaN(d))return null;const t=new Date();t.setHours(0,0,0,0);const x=Math.round((t-d)/86400000);return x===0?'D-Day':(x<0?'D-'+(-x):'D+'+x)}

function inline(s,ctx){
  if(!s)return '';
  s=scanFootnotes(s,ctx);
  s=s.replace(/\[\[(.+?)\]\]/g,(m,inner)=>ph(ctx,renderLink(inner,ctx)));
  s=s.replace(/\[([a-zA-Z가-힣]+)(?:\(([^)\]]*)\))?\]/g,(m,name,arg)=>{const r=macro(name,arg,ctx);return r===null?m:ph(ctx,r)});
  s=escT(s);
  s=s.replace(/'''(.+?)'''/g,'<strong>$1</strong>')
     .replace(/''(.+?)''/g,'<em>$1</em>')
     .replace(/__(.+?)__/g,'<u>$1</u>')
     .replace(/~~(.+?)~~/g,'<del>$1</del>')
     .replace(/--(.+?)--/g,'<del>$1</del>')
     .replace(/\^\^(.+?)\^\^/g,'<sup>$1</sup>')

function renderCell(txt,ctx){txt=txt.replace(/^\s+|\s+$/g,'');if(txt.includes('\n'))return renderBlocks(txt,ctx,false);return inline(txt,ctx)}
function renderTable(rows,ctx){
  const T={align:'',style:'',bc:null,cls:''};const colBg={},colFg={};
  let rowSpanLeft=[];

    let s=raw.replace(/\s+$/,'');
    s=s.slice(2,s.length-2);
    const parts=s.split('||');
    const cells=[];let span=1;
    for(const p of parts){if(p===''){span++;continue}cells.push({raw:p,span});span=1}
    let rowBg=null,rowFg=null;
    const tds=[];let col=0;
    for(const c of cells){
      let txt=c.raw;const a={colspan:c.span,rowspan:1,align:'',valign:'',bg:null,fg:null,w:null,h:null};let m;
      while((m=txt.match(/^\s*<([^<>\n]{1,80})>/))){

          if(pre==='table'){
            if(k==='align')T.align=v==='center'?'al-c':v==='right'?'al-r':'';
            else if(k==='width'){const z=sizeVal(v);if(z)T.style+=`width:${z};`}
            else if(k==='bgcolor'){const c2=colorVal(v);if(c2){const [st,cl]=bgStyle(c2);T.style+=st;T.cls+=' '+cl}}
            else if(k==='color'){const c2=colorVal(v);if(c2){const [st,cl]=fgStyle(c2);T.style+=st;T.cls+=' '+cl}}
            else if(k==='bordercolor'){const c2=colorVal(v);if(c2){T.bc=c2.l}}
          }else if(pre==='row'){if(k==='bgcolor')rowBg=colorVal(v);else if(k==='color')rowFg=colorVal(v)}
          else if(pre==='col'){if(k==='bgcolor')colBg[col]=colorVal(v);else if(k==='color')colFg[col]=colorVal(v)}
          else{if(k==='bgcolor')a.bg=colorVal(v);else if(k==='color')a.fg=colorVal(v);else if(k==='width')a.w=sizeVal(v);else if(k==='height')a.h=sizeVal(v);else if(k==='align')a.align=v;else ok=false}

      const bg=a.bg||rowBg||colBg[col]||null,fg=a.fg||rowFg||colFg[col]||null;

      if(a.valign)st+=`vertical-align:${a.valign};`;

      const cl=(bc+' '+fc).trim();

  return `<div class="wt-wrap ${T.align}"><table class="${tcl.trim()}" style="${escA(tst)}"><tbody>${trs.join('')}</tbody></table></div>`;

function renderList(lines,ctx){
  const items=[];
  for(const l of lines){
    const ind=l.match(/^ */)[0].length,t=l.slice(ind);let m;
    if((m=t.match(/^\*\s?(.*)$/)))items.push({ind,type:'ul',key:'ul',text:m[1]});
    else if((m=t.match(/^(1|a|A|i|I)\.(?:#(\d+))?\s(.*)$/)))items.push({ind,type:'ol',key:'ol'+m[1],kind:m[1],start:m[2],text:m[3]});
    else{const last=items[items.length-1];if(last&&last.type!=='in'&&ind>last.ind)last.text+='\n'+t;else items.push({ind,type:'in',key:'in',text:t})}
  }
  const li=t=>t.split('\n').map(x=>inline(x,ctx)).join('<br>');
  function build(i,ind){
    let html='',cur=null;
    while(i<items.length&&items[i].ind>=ind){
      const it=items[i];
      if(it.ind>ind&&cur&&cur!=='in'){const r=build(i,it.ind);html=html.replace(/<\/li>$/,r[0]+'</li>');i=r[1];continue}
      if(it.type==='in'){if(cur&&cur!=='in')html+=cur==='ul'?'</ul>':'</ol>';cur='in';html+=`<div class="wi">${li(it.text)}</div>`;i++;continue}
      if(cur!==it.key){if(cur&&cur!=='in')html+=cur==='ul'?'</ul>':'</ol>';html+=it.type==='ul'?'<ul>':`<ol type="${it.kind}"${it.start?` start="${+it.start}"`:''}>`;cur=it.key}
      html+=`<li>${li(it.text)}</li>`;i++;
    }
    if(cur&&cur!=='in')html+=cur==='ul'?'</ul>':'</ol>';
    return [html,i];
  }
  let html='',i=0;
  while(i<items.length){const r=build(i,items[i].ind);html+=r[0];i=r[1]}
  return html;
}

const HEAD_RE=/^(={1,6})(#?) (.+?) (#?)\1\s*$/;
function renderBlocks(src,ctx,top){
  src=extractBraces(src,ctx);
  src=src.replace(/\\(.)/g,(m,c)=>ph(ctx,escT(c)));
  const lines=src.split('\n');
  const out=[];let para=[];
  const flush=()=>{if(para.length){const ls=para.map(l=>inline(l,ctx)).filter(x=>unph(ctx,x).trim()!=='');if(ls.length)out.push({html:'<div class="wp">'+ls.join('<br>')+'</div>'});para=[]}};
  for(let i=0;i<lines.length;i++){
    const line=lines[i];let m;
    if((m=line.match(HEAD_RE))){flush();
      if(top)out.push({h:m[1].length,fold:!!m[2],html:inline(m[3],ctx)});
      else out.push({html:`<div class="wp"><strong>${inline(m[3],ctx)}</strong></div>`});
      continue}
    if(/^-{4,9}\s*$/.test(line)){flush();out.push({html:'<hr>'});continue}
    if(line.startsWith('||')){
      flush();const rows=[];
      while(i<lines.length&&lines[i].startsWith('||')){
        let buf=lines[i];
        const ended=b=>/\|\|\s*$/.test(b)&&b.trim().length>2;
        while(!ended(buf)&&i+1<lines.length){i++;buf+='\n'+lines[i]}
        rows.push(buf);i++;
      }
      i--;out.push({html:renderTable(rows,ctx)});continue;
    }
    if(line.startsWith('>')){
      flush();const q=[];
      while(i<lines.length&&lines[i].startsWith('>')){q.push(lines[i].slice(1).replace(/^ /,''));i++}
      i--;out.push({html:'<blockquote class="wq">'+renderBlocks(q.join('\n'),ctx,false)+'</blockquote>'});continue;
    }
    if(/^ +\S/.test(line)){
      flush();const L=[];
      while(i<lines.length&&/^ +\S/.test(lines[i])){L.push(lines[i]);i++}
      i--;out.push({html:renderList(L,ctx)});continue;
    }
    if(line.trim()===''){flush();continue}
    const pm=line.trim().match(/^\uE000(\d+)\uE001$/);

function buildSections(out,ctx){

  for(const o of out){

    while(stack.length&&stack[stack.length-1]>=o.h){html+='</div></div>';stack.pop()}
    cnt[o.h]++;for(let k=o.h+1;k<8;k++)cnt[k]=0;
    const num=cnt.slice(minL,o.h+1).join('.');
    const idx=ctx.heads.length;
    const id='s-'+num;
    ctx.heads.push({num,html:o.html,level:o.h-minL,id});
    const tag='h'+Math.min(6,o.h-minL+2);
    html+=`<div class="sec${o.fold?' folded':''}"><${tag} class="wh" id="${id}" data-sec="${idx}"><span class="tg" aria-hidden="true">▼</span><a class="num" href="#" data-anchor="toc">${num}.</a><span class="ht">${o.html}</span><a class="ed" href="#" data-act="secedit" data-sec="${idx}">[편집]</a></${tag}><div class="sec-body">`;

}

function scanHeadings(content){

/* ---------- diff ---------- */
function diffLines(a,b){
  const A=a.split('\n'),B=b.split('\n');
  if(A.length*B.length>4e6)return [{t:'s',s:'문서가 너무 커서 줄 단위 비교를 생략했습니다.'}];
  const n=A.length,m=B.length;const dp=new Int32Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*(m+1)+j]=A[i]===B[j]?dp[(i+1)*(m+1)+j+1]+1:Math.max(dp[(i+1)*(m+1)+j],dp[i*(m+1)+j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){out.push({t:'e',s:A[i]});i++;j++}else if(dp[(i+1)*(m+1)+j]>=dp[i*(m+1)+j+1]){out.push({t:'d',s:A[i++]})}else out.push({t:'a',s:B[j++]})}
  while(i<n)out.push({t:'d',s:A[i++]});while(j<m)out.push({t:'a',s:B[j++]});
  // collapse context
  const res=[];const keep=new Array(out.length).fill(false);
  out.forEach((o,k)=>{if(o.t!=='e')for(let x=Math.max(0,k-2);x<=Math.min(out.length-1,k+2);x++)keep[x]=true});
  let skipped=0;
  out.forEach((o,k)=>{if(keep[k]){if(skipped){res.push({t:'s',s:`… ${skipped}줄 같음 …`});skipped=0}res.push(o)}else skipped++});
  if(skipped)res.push({t:'s',s:`… ${skipped}줄 같음 …`});
  if(!out.some(o=>o.t!=='e'))return [{t:'s',s:'바뀐 내용이 없습니다.'}];
  return res;
}

function caretXY(ta,pos){
  const cs=getComputedStyle(ta);const d=document.createElement('div');
  ['boxSizing','width','paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','wordSpacing','tabSize'].forEach(k=>d.style[k]=cs[k]);
  Object.assign(d.style,{position:'absolute',visibility:'hidden',whiteSpace:'pre-wrap',overflowWrap:'break-word',top:'0',left:'-9999px'});
  d.textContent=ta.value.slice(0,pos);const sp=document.createElement('span');sp.textContent='​';d.appendChild(sp);document.body.appendChild(d);
  const r={x:sp.offsetLeft,y:sp.offsetTop-ta.scrollTop,lh:parseFloat(cs.lineHeight)||22};d.remove();return r;
}
function tplText(name){

  if(p)(p.content.match(/@([^@=\n]+?)(?:=[^@\n]*)?@/g)||[]).forEach(m=>{const k=m.slice(1,-1).split('=')[0].trim();if(k&&!seen.includes(k))seen.push(k)});
  return {txt:`[include(${name}${seen.map((k,i)=>`, ${k}=${i===0?'§':''}`).join('')}${seen.length?'':'§'})]`,n:seen.length};
}

function templates(){return [...S.byTitle.keys()].filter(x=>x.startsWith('템플릿:')).sort((a,b)=>a.localeCompare(b,'ko'))}

function blobToDataUrl(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)})}
function dataUrlToBlob(u){const m=String(u).match(/^data:([^;,]*)(;base64)?,(.*)$/);if(!m)throw new Error('bad data url');const raw=m[2]?atob(m[3]):decodeURIComponent(m[3]);const a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return new Blob([a],{type:m[1]||'application/octet-stream'})}
async function fileDataUrl(f){if(f.dataUrl)return f.dataUrl;if(f.assetId){const r=await fetch('/_blob/'+f.assetId);if(!r.ok)throw new Error('fetch '+r.status);return blobToDataUrl(await r.blob())}return null}
/* shrink an image until its data URL fits one database document */
async function compressImage(blob,maxBytes){
  if(blob.size<=maxBytes&&/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(blob.type))return {url:await blobToDataUrl(blob),type:blob.type,size:blob.size};
  const url0=URL.createObjectURL(blob);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej({code:'bad_image'});i.src=url0});
  let w=img.naturalWidth,h=img.naturalHeight;let scale=Math.min(1,1800/Math.max(w,h));let q=.88;let out=null;
  const cv=document.createElement('canvas');const cx=cv.getContext('2d');
  for(let tries=0;tries<14;tries++){
    cv.width=Math.max(1,Math.round(w*scale));cv.height=Math.max(1,Math.round(h*scale));cx.clearRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
    let b=await new Promise(r=>cv.toBlob(r,'image/webp',q));
    if(!b||b.type!=='image/webp'){cx.globalCompositeOperation='destination-over';cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.globalCompositeOperation='source-over';b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q))}
    out=b;if(b&&b.size<=maxBytes)break;
    if(q>.6)q-=.12;else scale*=.8;
  }
  URL.revokeObjectURL(url0);
  if(!out||out.size>maxBytes)throw {code:'too_big'};
  return {url:await blobToDataUrl(out),type:out.type,size:out.size};
}
async function uploadImage(f,name){
  const old=S.files.get(name);const id=old?old.id:uid();
  if(S.mode==='local'||S.mode==='fb'){
    const c=await compressImage(f,S.mode==='fb'?650000:900000);
    await store.putFile(id,{name,dataUrl:c.url,type:c.type,size:c.size,at:Date.now()});
  }else{
    if(!assets)throw {code:'no_assets'};
    const up=await assets.upload(f);
    await store.putFile(id,{name,assetId:up.id,type:up.contentType||f.type,size:up.sizeBytes||f.size,at:Date.now()});
    if(old&&old.assetId&&old.assetId!==up.id){try{await assets.delete(old.assetId)}catch(e){}}
  }
  return name;
}
function freeName(raw){
  let n=normTitle(raw)||('이미지-'+fmt(Date.now()).replace(/[^0-9]/g,'').slice(2,14)+'.png');

  const m=n.match(/^(.*?)(\.[a-zA-Z0-9]{1,5})?$/);let k=2;while(S.files.has(`${m[1]} (${k})${m[2]||''}`))k++;return `${m[1]} (${k})${m[2]||''}`;
}

async function buildBackup(prog){
  const revs=await store.allRevs();
  const files=[];let i=0;
  for(const f of S.files.values()){i++;prog&&prog(`이미지 ${i} / ${S.files.size} 담는 중…`);let d=null;try{d=await fileDataUrl(f)}catch(e){console.error(e)}files.push({id:f.id,name:f.name,type:f.type||'',size:f.size||0,at:f.at||Date.now(),dataUrl:d})}
  const clean=o=>{const x=Object.assign({},o);for(const k in x)if(x[k]===undefined)delete x[k];return x};
  return JSON.stringify({format:'mpwiki-backup',version:2,wiki:SITE(),exportedAt:new Date().toISOString(),meta:S.meta,pages:[...S.pages.values()].map(clean),revisions:revs.map(clean),files});
}
async function restoreBackup(data,prog){
  const strip=o=>{const x=Object.assign({},o);delete x.id;for(const k in x)if(x[k]===undefined||x[k]===null&&k!=='dataUrl')delete x[k];return x};
  const pages=(data.pages||[]).filter(p=>p&&p.title&&typeof p.content==='string');
  const revs=(data.revisions||[]).filter(r=>r&&r.title);
  const files=(data.files||[]).filter(f=>f&&f.name);
  const res={pages:0,revs:0,files:0,skipped:0};
  for(const p of pages){
    const t=normTitle(p.title);const id=String(p.id||uid()).replace(/[^A-Za-z0-9_\-.~:@+]/g,'')||uid();
    const ex=S.byTitle.get(t);if(ex&&ex.id!==id)await store.delPage(ex.id);
    await store.putPage(id,strip(Object.assign({rev:1,createdAt:Date.now(),updatedAt:Date.now(),links:[],cats:[],size:p.content.length},p,{title:t})));
    res.pages++;prog(`문서 ${res.pages} / ${pages.length}`);
  }
  for(const r of revs){
    const id=String(r.id||uid()).replace(/[^A-Za-z0-9_\-.~:@+]/g,'')||uid();
    await store.putRev(id,strip(r));res.revs++;if(res.revs%5===0||res.revs===revs.length)prog(`편집 기록 ${res.revs} / ${revs.length}`);
  }
  for(const f of files){
    if(!f.dataUrl){res.skipped++;continue}
    prog(`이미지 ${res.files+1} / ${files.length} 올리는 중…`);
    try{await uploadImage(dataUrlToBlob(f.dataUrl),normTitle(f.name));res.files++}catch(e){console.error(e);res.skipped++}
  }
  if(data.meta&&typeof data.meta==='object'){const m={};if(data.meta.name)m.name=String(data.meta.name);if(data.meta.front)m.front=String(data.meta.front);if(Object.keys(m).length)await store.putMeta(Object.assign({},S.meta,m))}
  return res;
}
function saveFile(name,text){
  if(downloads)return downloads.save({filename:name,data:new Blob([text],{type:'application/json'})});
  if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return Promise.resolve()}
  return Promise.reject({code:'no_download'});
}

    const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
    try{await auth.signInWithPopup(pr)}
    catch(e){
      const c=e&&e.code||'';
      if(/popup-blocked|operation-not-supported|web-storage-unsupported/.test(c)){try{await auth.signInWithRedirect(pr)}catch(e2){toast('로그인하지 못했습니다: '+(e2.code||e2.message))}}
      else if(c==='auth/unauthorized-domain')toast('이 주소가 Firebase 승인 도메인에 없습니다. 설정 안내의 5단계를 확인하세요.');
      else if(!/popup-closed|cancelled-popup/.test(c))toast('로그인하지 못했습니다: '+(c||e.message));
    }
  };
  auth.getRedirectResult().catch(e=>{console.error(e);if(e&&e.code==='auth/unauthorized-domain')toast('이 주소가 Firebase 승인 도메인에 없습니다.')});
  let lastUid;
  auth.onAuthStateChanged(u=>{
    S.user=u;const email=u&&u.email?u.email.toLowerCase():'';
    S.canWrite=!!u&&(!owner||/여기|YOUR/i.test(owner)||email===owner);
    btn.querySelector('.lbl').textContent=u?'로그아웃':'로그인';btn.title=u?`${u.email} · 로그아웃`:'구글로 로그인';
    const uid=u?u.uid:null;
    if(uid!==lastUid||!unsubs.length){lastUid=uid;subscribe()}else render(false);
    renderSide();
  });
}
renderSide();
init();
})();
</script>

</body>
</html>
